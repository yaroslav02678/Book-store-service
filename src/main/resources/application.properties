server.port=${SERVER_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO}

spring.sql.init.mode=${SQL_INIT_MODE}
spring.sql.init.schema-locations=${SQL_INIT_SCHEMA}
spring.sql.init.data-locations=${SQL_INIT_DATA}

spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}

spring.messages.basename=${MESSAGES_BASENAME}
spring.messages.encoding=${MESSAGES_ENCODING}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_TOKEN_EXPIRATION}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE}
gemini.api.key=${YOUR_GEMINI_API_KEY_HERE}
MESSAGES_BASENAME=messages


