<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title th:text="#{menu.books}">Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="mt-4"></div>

    <form th:action="@{/books/search}" method="get" class="mb-3">
        <input type="hidden" name="sortField" th:value="${sortField}" />
        <input type="hidden" name="sortDir" th:value="${sortDir}" />
        <input type="hidden" name="size" th:value="${pageSize}" />
        <input type="hidden" name="page" th:value="${currentPage}" />

        <div class="input-group">
            <input type="text" name="q" class="form-control" th:value="${keyword}" />
            <button class="btn btn-outline-primary" type="submit" th:text="#{button.search}">Search</button>
        </div>
    </form>

    <form th:action="@{/books}" method="get" class="mb-3 d-flex flex-wrap align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
            <label th:text="#{label.sortBy}" class="me-1">Sort by:</label>
            <select name="sortField" class="form-select" style="width:auto;">
                <option value="name" th:selected="${sortField=='name'}" th:text="#{book.name}">Назва</option>
                <option value="author" th:selected="${sortField=='author'}" th:text="#{book.author}">Автор</option>
                <option value="price" th:selected="${sortField=='price'}" th:text="#{book.price}">Ціна</option>
            </select>

            <select name="sortDir" class="form-select" style="width:auto;">
                <option value="asc" th:selected="${sortDir=='asc'}" th:text="#{label.asc}">Ascending</option>
                <option value="desc" th:selected="${sortDir=='desc'}" th:text="#{label.desc}">Descending</option>
            </select>

            <button type="submit" class="btn btn-primary" th:text="#{button.apply}">Apply</button>
            <div>
                <a sec:authorize="hasRole('ADMIN')"
                   th:href="@{|/books/add|}"
                   class="btn btn-primary"
                   th:text="#{button.add.Book}">Add Book</a>
            </div>
        </div>

        <div class="d-flex align-items-center gap-2">
            <label th:text="#{label.pageSize}" class="me-2">Items per page:</label>
            <select name="size" class="form-select" style="width:auto;">
                <option value="6" th:selected="${pageSize==6}">6</option>
                <option value="12" th:selected="${pageSize==12}">12</option>
                <option value="24" th:selected="${pageSize==24}">24</option>
            </select>

            <button type="submit" class="btn btn-primary" th:text="#{button.apply}">Apply</button>
        </div>
    </form>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="book : ${books.content}">
            <div class="card book-card h-100">
                <div class="text-center">
                    <img th:if="${book.imageUrl != null}"
                         th:src="${book.imageUrl}"
                         alt="Book Image"
                         class="img-fluid rounded"
                         style="width: 250px; height: 370px; object-fit: cover;">
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${book.name}">Book Name</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${book.author}">Author</h6>
                    <p class="card-text">
                        <span th:text="${book.price}"></span>
                    </p>
                    <div class="d-flex gap-2">
                        <form th:action="@{/cart/add/{id}(id=${book.id})}" method="post" sec:authorize="hasRole('CLIENT')">
                            <input type="hidden" name="q" th:value="${keyword}" />
                            <input type="hidden" name="page" th:value="${currentPage}" />
                            <input type="hidden" name="size" th:value="${pageSize}" />
                            <input type="hidden" name="sortField" th:value="${sortField}" />
                            <input type="hidden" name="sortDir" th:value="${sortDir}" />
                            <button type="submit" class="btn btn-primary btn-sm" th:text="#{book.button.add.to.cart}">Add to Cart</button>
                        </form>

                        <div sec:authorize="isAnonymous()">
                            <a th:href="@{/auth/login(redirect=${'/cart/add/' + book.id})}"
                               class="btn btn-primary btn-sm">
                                Login to add book
                            </a>
                        </div>

                        <a th:href="${(keyword != null and keyword != '' and keyword != 'null')
                      ? '/books/' + book.id + '?q=' + keyword + '&page=' + currentPage + '&size=' + pageSize + '&sortField=' + sortField + '&sortDir=' + sortDir
                      : '/books/' + book.id + '?page=' + currentPage + '&size=' + pageSize + '&sortField=' + sortField + '&sortDir=' + sortDir}"
                           class="btn btn-info btn-sm"
                           th:text="#{book.button.details}">
                            Details
                        </a>

                        <a sec:authorize="hasAnyRole('EMPLOYEE','ADMIN')"
                           th:href="@{/books/edit/{id}(id=${book.id}, page=${currentPage}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                           class="btn btn-warning btn-sm"
                           th:text="#{button.edit}">Edit</a>

                           <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/books/delete/{id}(id=${book.id}, page=${currentPage}, size=${pageSize}, sortField=${sortField}, sortDir=${sortDir})}"
                           class="btn btn-danger btn-sm"
                           th:text="#{button.delete}">Delete</a>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="mt-4"></div>

    <nav th:if="${books.totalPages > 1}">
        <ul class="pagination d-flex justify-content-center">

            <!-- Previous -->
            <li class="page-item" th:classappend="${books.first}? 'disabled'">
                <a class="page-link"
                   th:href="@{|/books?page=${books.number - 1}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}|}"
                   aria-label="Previous">&laquo;</a>
            </li>

            <!-- Numbered pages -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, books.totalPages - 1)}"
                th:classappend="${i == books.number}? 'active'">
                <a class="page-link"
                   th:href="@{|/books?page=${i}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}|}"
                   th:text="${i + 1}">1</a>
            </li>

            <!-- Next -->
            <li class="page-item" th:classappend="${books.last}? 'disabled'">
                <a class="page-link"
                   th:href="@{|/books?page=${books.number + 1}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}|}"
                   aria-label="Next">&raquo;</a>
            </li>

        </ul>
    </nav>


</div>
</body>
</html>
