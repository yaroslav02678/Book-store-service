<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title th:text="#{book.details}">Book Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="mt-4"></div>

    <div class="text-center mb-4">
        <img th:if="${book.imageUrl != null}"
             th:src="${book.imageUrl}"
             alt="Book Image"
             class="img-fluid rounded"
             style="width: 250px; height: 370px; object-fit: cover;">
    </div>

    <table class="table table-bordered">
        <tbody>
        <tr>
            <th th:text="#{book.name}"></th>
            <td th:text="${book.name}"></td>
        </tr>
        <tr>
            <th th:text="#{book.genre}"></th>
            <td th:text="${book.genre}"></td>
        </tr>
        <tr>
            <th th:text="#{book.author}"></th>
            <td th:text="${book.author}"></td>
        </tr>
        <tr>
            <th th:text="#{book.price}"></th>
            <td th:text="${book.price}"></td>
        </tr>
        <tr>
            <th th:text="#{book.publication.date}"></th>
            <td th:text="${book.publicationDate}"></td>
        </tr>
        <tr>
            <th th:text="#{book.description}"></th>
            <td th:text="${book.description}"></td>
        </tr>
        <tr>
            <th th:text="#{book.size}"></th>
            <td th:text="${book.pages}"></td>
        </tr>
        </tbody>
    </table>


    <div class="d-flex gap-2 align-items-center">
        <a th:href="${(keyword == null or keyword == '' or keyword == 'null')
          ? '/books?page=' + currentPage + '&size=' + pageSize + '&sortField=' + sortField + '&sortDir=' + sortDir
          : '/books/search?q=' + keyword + '&page=' + currentPage + '&size=' + pageSize + '&sortField=' + sortField + '&sortDir=' + sortDir}"
           class="btn btn-secondary"
           th:text="#{button.backToBooks}">
            Back to Books
        </a>

        <a th:if="${#authorization.expression('isAnonymous()')}"
           th:href="@{/auth/login(redirect=${'/cart/add/' + book.id})}"
           class="btn btn-secondary">
            Login to add book
        </a>

        <form th:if="${#authorization.expression('hasRole(''CLIENT'')')}"
              th:action="@{|/cart/add/${book.id}?page=${currentPage}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}&q=${keyword}|}"
              method="post"
              class="m-0 p-0">
            <button type="submit" class="btn btn-secondary"
                    th:text="#{book.button.add.to.cart}">Add to Cart</button>
        </form>
    </div>


</div>
</body>
</html>
