<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title th:text="#{menu.books}">Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="mt-4"></div>

    <!-- Search Form -->
    <form th:action="@{/books/search}" method="get" class="mb-3">
        <!-- Передаємо поточні параметри сортування та розмір сторінки -->
        <input type="hidden" name="sortField" th:value="${sortField}"/>
        <input type="hidden" name="sortDir" th:value="${sortDir}"/>
        <input type="hidden" name="size" th:value="${pageSize}"/>
        <input type="hidden" name="page" th:value="${currentPage}"/>

        <div class="input-group">
            <input type="text" name="q" class="form-control" th:value="${keyword}" placeholder="Search by name or author"/>
            <button class="btn btn-outline-primary" type="submit" th:text="#{button.search}">Search</button>
        </div>
    </form>

    <!-- Sort and page size controls -->
    <form th:action="@{/books}" method="get" class="mb-3 d-flex flex-wrap align-items-center justify-content-between">
        <!-- Left side: Sort controls -->
        <div class="d-flex align-items-center gap-2">
            <!-- Sort Field -->
            <label th:text="#{label.sortBy}" class="me-1">Sort by:</label>
            <select name="sortField" class="form-select" style="width:auto;">
                <option value="name" th:selected="${sortField=='name'}" th:text="#{book.name}">Назва</option>
                <option value="author" th:selected="${sortField=='author'}" th:text="#{book.author}">Автор</option>
                <option value="price" th:selected="${sortField=='price'}" th:text="#{book.price}">Ціна</option>
            </select>

            <!-- Sort Direction -->
            <select name="sortDir" class="form-select" style="width:auto;">
                <option value="asc" th:selected="${sortDir=='asc'}" th:text="#{label.asc}">Ascending</option>
                <option value="desc" th:selected="${sortDir=='desc'}" th:text="#{label.desc}">Descending</option>
            </select>

            <!-- Apply Button -->
            <button type="submit" class="btn btn-primary" th:text="#{button.apply}">Apply</button>
        </div>

        <!-- Right side: Page size and button -->
        <div class="d-flex align-items-center gap-2">
            <!-- Page Size -->
            <label th:text="#{label.pageSize}" class="me-2">Items per page:</label>
            <select name="size" class="form-select" style="width:auto;">
                <option value="5" th:selected="${pageSize==6}">6</option>
                <option value="10" th:selected="${pageSize==12}">12</option>
                <option value="20" th:selected="${pageSize==24}">24</option>
            </select>

            <!-- Apply Button -->
            <button type="submit" class="btn btn-primary" th:text="#{button.apply}">Apply</button>
        </div>
    </form>

    <!-- Book Table -->
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="book : ${books.content}">
            <div class="card book-card h-100">
                <div class="text-center">
                    <img th:if="${book.imageUrl != null}"
                         th:src="${book.imageUrl}"
                         alt="Book Image"
                         class="img-fluid rounded"
                         style="width: 250px; height: 370px; object-fit: cover;">
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${book.name}">Book Name</h5>
                    <h6 class="card-subtitle mb-2 text-muted" th:text="${book.author}">Author</h6>
                    <p class="card-text">
                        <span th:text="${book.price}"></span>
                    </p>
                    <div class="d-flex gap-2">
                        <div sec:authorize="isAnonymous()">
                            <a th:href="@{/auth/login(redirect=${'/cart/add/' + book.id})}"
                               class="btn btn-primary btn-sm">
                                Login to add book
                            </a>
                        </div>
                        <form th:action="@{|/cart/add/${book.id}|}" method="post" sec:authorize = "hasRole('CLIENT')">
                            <button type="submit" class="btn btn-primary btn-sm"
                                    th:text="#{book.button.add.to.cart}">Add to Cart</button>
                        </form>
                        <a th:href="@{|/books/${book.id}?page=${0}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}&q=${keyword}|}"
                           class="btn btn-info btn-sm"
                           th:text="#{book.button.details}">Details</a>
                        <a th:href="@{|/books/edit/${book.id}|}" class="btn btn-warning btn-sm" sec:authorize="hasRole('ADMIN')">Edit</a>
                        <a th:href="@{|/books/delete/${book.id}|}" class="btn btn-danger btn-sm" sec:authorize="hasRole('ADMIN')">Delete</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-4"></div>

    <!-- Pagination -->
    <nav th:if="${books.totalPages > 1}" class="d-flex justify-content-center">
        <ul class="pagination">
            <li class="page-item" th:classappend="${books.first}? 'disabled'">
                <a class="page-link" th:href="@{|/books/search?q=${keyword}&page=${books.number - 1}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}|}" aria-label="Previous">&laquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, books.totalPages - 1)}"
                th:classappend="${i == books.number}? 'active'">
                <a class="page-link" th:href="@{|/books/search?q=${keyword}&page=${i}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}|}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${books.last}? 'disabled'">
                <a class="page-link" th:href="@{|/books/search?q=${keyword}&page=${books.number + 1}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}|}" aria-label="Next">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
