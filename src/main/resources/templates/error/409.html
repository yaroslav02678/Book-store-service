<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.title.409}">Conflict</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-5 text-center">
    <h1 class="display-4 text-danger" th:text="#{error.title.409}">Conflict</h1>
    <p class="lead" th:text="${errorMessage}">Already exists.</p>
    <a th:href="@{/books}" class="btn btn-primary" th:text="#{button.backToBooks}">Back to Books</a>
</div>
</body>
</html>
