<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-group { margin-bottom: 1rem; }
        .btn-block { width: 100%; }
    </style>
</head>
<body class="bg-gradient-primary" style="background-color: #f8f9fc;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-6 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-5">
                    <div class="text-center">
                        <h1 class="h4 text-gray-900 mb-4">Login</h1>
                    </div>
                    <div th:if="${param.reset_success}" class="alert alert-success text-center">
                        Your password has been reset successfully. Please log in.
                    </div>
                    <div th:if="${registration_success}" class="alert alert-success text-center">
                        <p th:text="${registration_success}"></p>
                    </div>
                    <div th:if="${error}" class="alert alert-danger text-center">
                        <p th:text="${error}"></p>
                    </div>

                    <form th:action="@{/auth/login}" method="post" class="user">
                        <input type="hidden" name="redirect" th:value="${param.redirect}" />
                        <div class="form-group">
                            <input type="email" name="email" class="form-control form-control-user"
                                   placeholder="Enter Email..." required>
                        </div>
                        <div class="form-group">
                            <input type="password" name="password" class="form-control form-control-user"
                                   placeholder="Password" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-user btn-block">
                            Login
                        </button>
                    </form>

                    <hr>
                    <div class="text-center">
                        <a class="small" th:href="@{/auth/forgot-password}">Forgot Password?</a>
                    </div>
                    <div class="text-center mt-2">
                        <a th:href="@{/auth/client}" class="small">Register</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
