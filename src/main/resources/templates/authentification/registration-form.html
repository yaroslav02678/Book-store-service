<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-group { margin-bottom: 1rem; }
        .btn-block { width: 100%; }
    </style>
</head>
<body class="bg-gradient-primary" style="background-color: #f8f9fc;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-6 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-5">
                    <div class="text-center">
                        <h1 class="h4 text-gray-900 mb-4" th-text="${formTitle}">Create an Account</h1>
                    </div>

                    <form th:action="@{/auth/client}" th:object="${registrationDto}" method="post" class="user">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                        </div>

                        <!-- ПОЛЕ ДЛЯ ІМЕНІ (ОДНЕ) -->
                        <div class="form-group">
                            <input type="text" class="form-control form-control-user" placeholder="Full Name"
                                   th:field="*{name}" required>
                            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small mt-1"></div>
                        </div>

                        <!-- ПОЛЕ ДЛЯ EMAIL -->
                        <div class="form-group">
                            <input type="email" class="form-control form-control-user" placeholder="Email Address"
                                   th:field="*{email}" required>
                            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small mt-1"></div>
                        </div>

                        <!-- ПОЛЕ ДЛЯ ПАРОЛЯ -->
                        <div class="form-group">
                            <input type="password" class="form-control form-control-user" placeholder="Password"
                                   th:field="*{password}" required>
                            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small mt-1"></div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-user btn-block">
                            Register Account
                        </button>
                    </form>

                    <hr>
                    <div class="text-center">
                        <a class="small" th:href="@{/auth/login}">Already have an account? Login!</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
