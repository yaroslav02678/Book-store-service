<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-group { margin-bottom: 1rem; }
        .btn-block { width: 100%; }
    </style>
</head>
<body class="bg-gradient-primary" style="background-color: #f8f9fc;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-6 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-5">
                    <div class="text-center">
                        <h1 class="h4 text-gray-900 mb-4">Reset Your Password</h1>
                    </div>

                    <form th:action="@{/auth/reset-password}" th:object="${passwordDto}" method="post" class="user">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                        </div>

                        <!-- Приховане поле для токена -->
                        <input type="hidden" th:field="*{token}" />

                        <div class="form-group">
                            <input type="password" class="form-control form-control-user"
                                   placeholder="New Password" th:field="*{password}" required>
                            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="form-group">
                            <input type="password" class="form-control form-control-user"
                                   placeholder="Confirm New Password" th:field="*{confirmPassword}" required>
                            <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-danger small mt-1"></div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-user btn-block">
                            Reset Password
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
