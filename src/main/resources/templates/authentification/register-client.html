<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center bg-light">

<div class="card shadow-lg p-4" style="width: 400px;">
    <div class="text-center mb-3">
        <h2>Register Client</h2>
    </div>

    <form th:action="@{/register/client}" method="post">
        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" name="fullName" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" name="email" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Password:</label>
            <input type="password" name="password" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <div th:if="${success}" class="mt-3 text-success text-center">
        <p th:text="${success}"></p>
    </div>
    <div th:if="${error}" class="mt-3 text-danger text-center">
        <p th:text="${error}"></p>
    </div>

    <div class="text-center mt-3">
        <a th:href="@{/auth/login}">Back to login</a>
    </div>
</div>

</body>
</html>
