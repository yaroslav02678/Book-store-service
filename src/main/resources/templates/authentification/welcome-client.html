<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Welcome Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center bg-light">

<div class="card shadow-lg p-4 text-center" style="width: 400px;">
    <h2>Welcome, Client!</h2>
    <p>Your token:</p>
    <p th:text="${token}" class="text-break"></p>
    <a th:href="@{/auth/login}" class="btn btn-secondary mt-3">Logout</a>
</div>

</body>
</html>
