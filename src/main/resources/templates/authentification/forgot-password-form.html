<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-group { margin-bottom: 1rem; }
        .btn-block { width: 100%; }
    </style>
</head>
<body class="bg-gradient-primary" style="background-color: #f8f9fc;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-6 col-md-9">
            <div class="card o-hidden border-0 shadow-lg my-5">
                <div class="card-body p-5">
                    <div class="text-center">
                        <h1 class="h4 text-gray-900 mb-2">Forgot Your Password?</h1>
                        <p class="mb-4">Enter your email address and we will send you a link to reset your password.</p>
                    </div>

                    <!-- Повідомлення про успішну відправку -->
                    <div th:if="${message}" class="alert alert-info text-center">
                        <p th:text="${message}"></p>
                    </div>

                    <form th:action="@{/auth/forgot-password}" method="post" class="user">
                        <div class="form-group">
                            <input type="email" name="email" class="form-control form-control-user"
                                   placeholder="Enter Email Address..." required autofocus>
                        </div>
                        <button type="submit" class="btn btn-primary btn-user btn-block">
                            Send Reset Link
                        </button>
                    </form>

                    <hr>
                    <div class="text-center">
                        <a class="small" th:href="@{/auth/login}">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
