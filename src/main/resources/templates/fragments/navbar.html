<div th:fragment="navbar" xmlns:sec="http://www.w3.org/1999/xhtml">
    <nav class="navbar navbar-expand-lg" style="background-color: #343a40;">
        <div class="container-fluid">
            <a class="navbar-brand text-white" th:text="#{menu.books}" th:href="@{/books}">Books</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <!-- CLIENT -->
                    <li class="nav-item" sec:authorize="hasRole('CLIENT')">
                        <a class="navbar-brand text-white" th:text="#{menu.cart}" th:href="@{/cart}">Cart</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('CLIENT')">
                        <a class="navbar-brand text-white" th:text="#{menu.orders}" th:href="@{/orders/my/client}">Orders</a>
                    </li>

                    <!-- EMPLOYEE -->
                    <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')">
                        <a class="navbar-brand text-white" th:text="#{menu.orders}" th:href="@{/orders/my/employee}">Orders</a>
                    </li>

                    <!-- ADMIN -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="navbar-brand text-white" th:text="#{menu.admin.panel}" th:href="@{/orders/my/admin}">Admin Orders</a>
                    </li>
                </ul>

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 d-flex align-items-center">
                    <!-- Language switch -->
                    <li class="nav-item me-3 d-flex align-items-center">
                        <div class="form-check form-switch m-0">
                            <input class="form-check-input" type="checkbox" id="languageSwitch"
                                   th:checked="${#locale.language == 'en'}"
                                   onchange="switchLanguage(this)">
                            <label class="form-check-label text-white" for="languageSwitch">
                                <span th:text="${#locale.language == 'en' ? 'EN' : 'UA'}">EN</span>
                            </label>
                        </div>
                    </li>

                    <!-- Login -->
                    <li class="nav-item ms-3" sec:authorize="!isAuthenticated()">
                        <a class="nav-link text-white" th:href="@{/auth/login}" th:text="#{menu.login}">Login</a>
                    </li>

                    <!-- Logout -->
                    <li class="nav-item ms-3" sec:authorize="isAuthenticated()">
                        <form th:action="@{/auth/logout}" method="post" class="d-inline">
                            <button class="btn btn-link nav-link text-white p-0" type="submit" th:text="#{menu.Logout}">Logout</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script>
        function switchLanguage(checkbox) {
            const newLang = checkbox.checked ? 'en' : 'uk';
            const url = new URL(window.location.href);
            url.searchParams.set('lang', newLang);
            window.location.href = url.toString();
        }
    </script>
</div>
