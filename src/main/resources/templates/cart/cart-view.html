<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{cart.title}">Your Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="mt-4"></div>

    <div th:if="${#lists.isEmpty(cartItems)}" class="alert alert-info" th:text="#{cart.empty}">Cart is empty</div>

    <div class="row" th:if="${!#lists.isEmpty(cartItems)}">
        <div class="col-md-4 mb-3" th:each="item : ${cartItems}">
            <div class="card h-100">
                <!-- Картинка книги -->
                <img th:if="${item.book.imageUrl != null}"
                     th:src="${item.book.imageUrl}"
                     class="card-img-top img-fluid rounded"
                     style="max-height: 370px; object-fit: contain;"
                     alt="Book Image">

                <div class="card-body">
                    <h5 class="card-title" th:text="${item.book.name}">Book Name</h5>
                    <p class="card-text">
                        <span th:text="${item.book.author}">Author</span><br/>
                        <span th:text="${item.book.price}">0.00 USD</span><br/>
                        <!-- Кількість з кнопками -->
                    <div class="d-flex align-items-center gap-2 mt-2">
                        <form th:action="@{|/cart/decrease/${item.book.id}|}" method="post">
                            <button type="submit" class="btn btn-secondary btn-sm">-</button>
                        </form>
                        <span th:text="${item.quantity}">1</span>
                        <form th:action="@{|/cart/increase/${item.book.id}|}" method="post">
                            <button type="submit" class="btn btn-secondary btn-sm">+</button>
                        </form>
                    </div>
                    </p>
                    <a th:href="@{|/cart/remove/${item.book.id}|}" class="btn btn-danger btn-sm mt-2" th:text="#{cart.remove}">Remove</a>
                </div>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-3">
        <!-- Left side -->
        <a th:href="@{/books}" class="btn btn-primary" th:text="#{cart.continue}">Continue Shopping</a>

        <!-- Right side -->
        <div class="d-flex align-items-center gap-3">
            <h3 class="mb-0" th:text="#{cart.total} + ': ' + ${totalPrice} + ' USD'">Total: 0.0 USD</h3>
            <form th:action="@{/orders/create}" method="post">
                <button type="submit" class="btn btn-success" th:text="#{cart.checkout}">Checkout</button>
            </form>
        </div>
    </div>



</div>
