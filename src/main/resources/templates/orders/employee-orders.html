<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">

    <!-- Фільтри та сортування -->
    <form th:action="@{/orders}" method="get" class="mb-3 d-flex flex-wrap align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
            <label th:text="#{label.sortBy}" class="me-1">Sort by:</label>
            <select name="sortField" class="form-select" style="width:auto;">
                <option value="price" th:selected="${sortField=='price'}" th:text="#{orders.column.total}">Сума</option>
                <option value="orderDate" th:selected="${sortField=='orderDate'}" th:text="#{orders.column.date}">Дата</option>
                <option value="status" th:selected="${sortField=='status'}" th:text="#{orders.column.status}">Статус</option>
            </select>

            <select name="sortDir" class="form-select" style="width:auto;">
                <option value="asc" th:selected="${sortDir=='asc'}" th:text="#{label.asc}">Ascending</option>
                <option value="desc" th:selected="${sortDir=='desc'}" th:text="#{label.desc}">Descending</option>
            </select>

            <button type="submit" class="btn btn-primary" th:text="#{button.apply}">Apply</button>
        </div>

        <div class="d-flex align-items-center gap-2">
            <label th:text="#{label.pageSize}" class="me-2">Items per page:</label>
            <select name="size" class="form-select" style="width:auto;">
                <option value="5" th:selected="${pageSize==5}">5</option>
                <option value="10" th:selected="${pageSize==10}">10</option>
                <option value="20" th:selected="${pageSize==20}">20</option>
            </select>
            <button type="submit" class="btn btn-primary" th:text="#{button.apply}">Apply</button>
        </div>
    </form>

    <!-- Таблиця замовлень -->
    <table class="table table-hover" th:if="${!#lists.isEmpty(orders.content)}">
        <thead>
        <tr>
            <th th:text="#{orders.column.id}">ID</th>
            <th th:text="#{orders.column.client}">Клієнт</th>
            <th th:text="#{orders.column.total}">Сума</th>
            <th th:text="#{orders.column.status}">Статус</th>
            <th th:text="#{orders.column.date}">Дата</th>
            <th th:text="#{button.actions}">Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders.content}">
            <td th:text="${order.id}">1</td>
            <td th:text="${order.clientEmail}">John Doe</td>
            <td th:text="${order.price}">100.00</td>
            <td th:text="${order.status}">NEW</td>
            <td th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm')}">2025-09-30 12:00</td>
            <td class="d-flex gap-2">
                <!-- Зміна статусу -->
                <div class="d-flex gap-2">

                    <form th:action="@{'/orders/update/' + ${order.id}}" method="post" class="d-flex gap-1">
                        <select name="status" class="form-select">
                            <option th:each="s : ${T(com.epam.rd.autocode.spring.project.model.enums.OrderStatus).values()}"
                                    th:value="${s}" th:text="${s}"
                                    th:selected="${s == order.status}"></option>
                        </select>
                        <button type="submit" class="btn btn-sm btn-primary">Update</button>
                    </form>
                </div>
                <form th:action="@{|/orders/delete/${order.id}|}" method="post" class="d-flex gap-1">
                    <button type="submit" class="btn btn-sm btn-danger" th:text="#{button.delete}">Delete</button>
                </form>

            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(orders.content)}" class="alert alert-info text-center">
        No orders found.
    </div>

    <!-- Пагінація -->
    <nav th:if="${orders.totalPages > 1}" class="d-flex justify-content-center mt-4">
        <ul class="pagination">
            <li class="page-item" th:classappend="${orders.first}? 'disabled'">
                <a class="page-link" th:href="@{|/orders?page=${orders.number - 1}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}|}" aria-label="Previous">&laquo;</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                th:classappend="${i == orders.number}? 'active'">
                <a class="page-link" th:href="@{|/orders?page=${i}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}|}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${orders.last}? 'disabled'">
                <a class="page-link" th:href="@{|/orders?page=${orders.number + 1}&size=${pageSize}&sortField=${sortField}&sortDir=${sortDir}|}" aria-label="Next">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
