# ===============================================
#  Повна конфігурація для тестового середовища
# ===============================================

# --- Сервер ---
# Запускаємо на випадковому вільному порту
SERVER_PORT=0

# --- База даних H2 (в пам'яті) ---
# Налаштовуємо легку in-memory базу даних для тестів
DB_URL=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
DB_USERNAME=sa
DB_PASSWORD=

# --- Налаштування JPA/Hibernate для тестів ---
# Створювати схему при старті і видаляти при завершенні тестів
JPA_HIBERNATE_DDL_AUTO=create-drop
# Вимикаємо ініціалізацію через зовнішні SQL-скрипти
SQL_INIT_MODE=never
SQL_INIT_SCHEMA=
SQL_INIT_DATA=
# Не показувати SQL-запити в консолі під час тестів (щоб не засмічувати лог)
JPA_SHOW_SQL=false
JPA_FORMAT_SQL=false

# --- Інтернаціоналізація (i18n) ---
MESSAGES_BASENAME=messages
MESSAGES_ENCODING=UTF-8

# --- JWT Конфігурація ---
# Використовуємо фіктивний, але валідний секретний ключ для тестів
JWT_SECRET=test-secret-key-that-is-long-enough-for-sha256-algorithm
JWT_ACCESS_TOKEN_EXPIRATION=3600
JWT_REFRESH_TOKEN_EXPIRATION=86400

# --- Поштова конфігурація (фіктивна) ---
# Надаємо фіктивні значення, щоб контекст міг завантажитись
MAIL_HOST=localhost
MAIL_PORT=25
MAIL_USERNAME=
MAIL_PASSWORD=
MAIL_SMTP_AUTH=false
MAIL_STARTTLS_ENABLE=false

# --- API Ключі (фіктивні) ---
YOUR_GEMINI_API_KEY_HERE=dummy-api-key-for-tests




